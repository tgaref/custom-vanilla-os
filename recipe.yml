name: Custom Vanilla Desktop # Replace this name with your image name
id: custom # Replace this ID with your image ID
vibversion: 1.1.0

stages:
- id: build
  base: ghcr.io/vanilla-os/gnome:latest # Optionally, Replace this image URL with a different one i.e. gnome-nvidia:latest, etc
  addincludes: true
  singlelayer: false
  labels:
    maintainer: self-maintained # Optionally, Replace this with your name
  args:
    DEBIAN_FRONTEND: noninteractive # Set the image environment as non-interactive
  cleanup:
    - /tmp/*
    - /var/tmp/*

  # Commands to run first before building the modules
  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends

  modules:
  - name: init-setup
    type: shell
    commands:
    - lpkg --unlock
    - apt-get update

  # Put your custom actions below this comment

  - name: add-niri-repo
    type: shell
    commands:
      - curl -fsSL https://download.opensuse.org/repositories/home:/AvengeMedia:/danklinux/Debian_Testing/Release.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/home_AvengeMedia_danklinux.gpg
      - echo 'deb http://download.opensuse.org/repositories/home:/AvengeMedia:/danklinux/Debian_Testing/ /' > /etc/apt/sources.list.d/home:AvengeMedia:danklinux.list
      - apt-get update
      - ldconfig

  - name: custom-packages
    type: apt
    sources:
      - packages:
        # User CLI & Apps
        - fish
        - wl-clipboard
        - emacs-pgtk
        - alacritty
        - udiskie
        - fuzzel
        - brightnessctl
        - playerctl
        - borgbackup
        - libvterm0
        - libvterm-dev
        # Homebrew prerequisites
        - build-essential
        - procps
        - curl
        - file
        - git
        # Wayland Compositor & Xwayland
        - niri
        - xwayland-satellite
        # Noctalia runtime libraries
        - libsdbus-c++2
        - libgles2
        - libsecret-1-0
        - libsodium26
        - libpipewire-0.3-0t64
        - libwireplumber-0.5-0
        - libqalculate23
        - libical3t64
        - libtomlplusplus3t64
        - libmd4c0
        - libwebp7
        - libwebpdemux2
        - libsndfile1
        - libjemalloc2
        - libinput10
        - libseat1
        - libxml2-16

  # Put your custom actions above this comment

  - name: set-image-name-abroot
    type: includes
    includes:
      - modules/80-set-image-abroot-config.yml

  - name: cleanup
    type: shell
    commands:
    - apt-get autoremove -y
    - apt-get clean
    - lpkg --lock