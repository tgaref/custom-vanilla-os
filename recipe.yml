name: Custom Vanilla Desktop # Replace this name with your image name
id: custom # Replace this ID with your image ID
vibversion: 1.1.0

stages:
- id: build
  base: ghcr.io/vanilla-os/gnome:latest # Optionally, Replace this image URL with a different one i.e. gnome-nvidia:latest, etc
  addincludes: true
  singlelayer: false
  labels:
    maintainer: self-maintained # Optionally, Replace this with your name
  args:
    DEBIAN_FRONTEND: noninteractive # Set the image environment as non-interactive
  cleanup:
    - /tmp/*
    - /var/tmp/*

  # Commands to run first before building the modules
  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends

  modules:
  - name: init-setup
    type: shell
    commands:
    - lpkg --unlock
    - apt-get update

  # Put your custom actions below this comment

  - name: add-noctalia-repo
    type: shell
    commands:
      - curl -fsSL https://pkg.noctalia.dev/deb/nickh-archive-keyring.gpg -o /usr/share/keyrings/nickh-archive-keyring.gpg
      - >-
        printf "Enabled: True\nTypes: deb\nURIs: https://pkg.noctalia.dev/deb/\nSigned-By: /usr/share/keyrings/nickh-archive-keyring.gpg\nSuites: trixie/ trixie-backports/\nArchitectures: amd64\n" > /etc/apt/sources.list.d/noctalia-trixie.sources
      - apt-get update

  - name: install-all-packages
    type: shell
    commands:
      - >-
        apt-get install -y --no-install-recommends
        fish wl-clipboard emacs-pgtk alacritty udiskie fuzzel
        brightnessctl playerctl libvterm0 libvterm-dev
        build-essential procps curl file git
        libxcb-cursor0 libxcb-image0 libxcb-render-util0 libxcb-util1
        libinput10 libseat1
        noctalia
        hplip printer-driver-foo2zjs
      - ldconfig

  # Put your custom actions above this comment

  - name: set-image-name-abroot
    type: includes
    includes:
      - modules/80-set-image-abroot-config.yml

  - name: cleanup
    type: shell
    commands:
    - apt-get autoremove -y
    - apt-get clean
    - lpkg --lock
